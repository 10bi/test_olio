<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OLIO Animated Talents</title>
<link rel="stylesheet" href="animated-home.css">
</head>
<body>

<header>
  <img src="https://olio.my/images/logo.png" height="40">
  <button class="apply-btn" id="applyBtn">🏠 Build House</button>
</header>

<div class="hint" id="hint">🖱️ Mouse look &nbsp;|&nbsp; ⌨️ WASD walk &nbsp;|&nbsp; 🏠 Click house</div>
<div class="crosshair" id="crosshair"></div>
<div id="fps">-- FPS</div>
<button class="back-btn" id="backBtn">← Back (ESC)</button>
<div class="toast" id="toast">Move closer!</div>

<div id="mobileControls">
  <div class="look-pad" id="lookPad"></div>
  <div class="joystick-zone" id="joystickZone">
    <div class="joystick-stick" id="joystickStick"></div>
    <div class="joystick-label">MOVE</div>
  </div>
  <div class="tap-hint">👆 Tap to interact</div>
</div>

<!-- LOADING OVERLAY WITH DESCRIPTION -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-title" id="loadingTitle">LOADING...</div>
  <div class="loading-desc" id="loadingDesc"></div>
</div>

<div class="iframe-modal" id="iframeModal">
  <div class="iframe-container">
    <button class="iframe-close" id="iframeClose">✕</button>
    <iframe id="pcIframe" src="about:blank" allow="fullscreen"></iframe>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module" src="animated-home.js"></script>
</body>
</html>
